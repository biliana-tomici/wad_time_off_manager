<header class="topbar">
  <div>
    <p class="eyebrow">{{ today() }}</p>
    <p>{{ greeting() }}{{ session.current() ? ', ' + session.current()?.firstName : '' }}.</p>
  </div>
  @if (session.offline()) {
    <span class="pill pill-off">Offline</span>
  } @else if (session.ready() && session.current()) {
    <div class="row-actions" style="align-items: center;">
      <span class="pill pill-live">{{ session.roleLabel() }} · {{ fullName(session.current()) }}</span>
      <button type="button" class="btn ghost" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" (click)="session.logout()">Sign out</button>
    </div>
  }
</header>
