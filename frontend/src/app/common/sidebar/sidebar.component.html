<aside class="sidebar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22">
        <rect x="5" y="7" width="22" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M5 13h22M11 4.5v5M21 4.5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <h1>Time Off Manager</h1>
  </div>

  <nav class="sidebar-nav">
    @for (item of items(); track item.link) {
      <a class="nav-link" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.exact }">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @switch (item.icon) {
            @case ('overview') {
              <rect x="3" y="3" width="7" height="7" rx="1.5"/>
              <rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/>
              <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            }
            @case ('plus') {
              <path d="M12 5v14M5 12h14"/>
            }
            @case ('history') {
              <circle cx="12" cy="12" r="8"/>
              <path d="M12 8v5l3 2"/>
            }
            @case ('projects') {
              <path d="M4 8l8-4 8 4-8 4-8-4z"/>
              <path d="M4 12l8 4 8-4"/>
              <path d="M4 16l8 4 8-4"/>
            }
            @case ('approvals') {
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            }
            @default {
              <circle cx="9" cy="9" r="3"/>
              <circle cx="16" cy="10" r="2.2"/>
              <path d="M3.5 19c.8-2.6 2.8-4 5.5-4s4.7 1.4 5.5 4"/>
              <path d="M14 15.2c1.5-.4 2.8-.2 4 .7 1 1 1.5 2 1.7 3.1"/>
            }
          }
        </svg>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="user-card">
    <label class="switcher">
      Viewing as
      <select [value]="'' + (session.current()?.id ?? '')" (change)="pick($event)" [disabled]="session.users().length === 0">
        @for (user of session.users(); track user.id) {
          <option [value]="user.id">{{ user.firstName }} {{ user.lastName }}</option>
        }
      </select>
    </label>
    <div class="who">
      <span class="avatar">{{ initials(session.current()) }}</span>
      <div>
        <strong>{{ fullName(session.current()) }}</strong>
        <small>{{ session.roleLabel() }}</small>
      </div>
    </div>
  </div>
</aside>
