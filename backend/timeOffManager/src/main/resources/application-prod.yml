spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timeoff}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:time-off-manager-prod-jwt-secret-key-override-via-env-var-256-bits}
      expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin-email: ${APP_ADMIN_EMAIL:alice.smith@timeoff.com}
    admin-password: ${APP_ADMIN_PASSWORD:password123}
    admin-first-name: ${APP_ADMIN_FIRST_NAME:Alice}
    admin-last-name: ${APP_ADMIN_LAST_NAME:Smith}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@timeoff.com}
    frontend-url: ${FRONTEND_URL:http://localhost}
